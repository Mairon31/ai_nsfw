name: Check Colab Studio

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install ipywidgets huggingface_hub requests 'aiohttp>=3.10,<4'
      - name: Compile launcher and tests
        run: python -m compileall -q studio tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify upstream A1111 mirror is accessible
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: git ls-remote https://github.com/w-e-w/stablediffusion.git HEAD
      - name: Verify isolated Python 3.10 can be provisioned
        run: |
          python -m pip install -q uv
          uv venv --seed --python 3.10 --managed-python /tmp/anime-studio-a1111-smoke
          /tmp/anime-studio-a1111-smoke/bin/python -c 'import sys,pip; assert sys.version_info[:2] == (3,10); print(sys.version)'
      - name: Regression check - install legacy OpenAI CLIP under Python 3.10
        run: |
          PY=/tmp/anime-studio-a1111-smoke/bin/python
          "$PY" -m pip install 'setuptools==69.5.1' wheel ftfy regex tqdm
          "$PY" -m pip install --no-build-isolation --no-deps https://github.com/openai/CLIP/archive/d50d76daa670286dd6cacf3bcd80b5e4823fc8e1.zip
          "$PY" -c 'import pkg_resources,importlib.metadata as m; assert m.version("clip") == "1.0"; print("CLIP installed:", m.version("clip"))'
      - name: Reproduce Colab MPLBACKEND error and validate Agg in Python 3.10
        run: |
          PY=/tmp/anime-studio-a1111-smoke/bin/python
          "$PY" -m pip install 'matplotlib==3.9.4'
          MPLBACKEND=Agg "$PY" -c 'import matplotlib; assert matplotlib.get_backend().lower() == "agg"; print("Matplotlib backend:", matplotlib.get_backend())'
